name: Weekly Custom Desktop Release

on:
  schedule:
    # Monday 14:35 Asia/Kolkata = Monday 09:05 UTC
    - cron: "5 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: skyhook-io/radar

jobs:
  build-macos:
    name: Build and Publish Weekly macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream --tags

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Compute weekly release metadata
        id: meta
        run: |
          set -euo pipefail

          BASE_TAG="$(git tag -l 'v*' --sort=-v:refname | grep -Ev -- '-fork\.' | head -n1)"
          if [ -z "${BASE_TAG}" ]; then
            echo "Could not determine upstream base tag" >&2
            exit 1
          fi

          DATE_UTC="$(date -u +%Y%m%d)"
          RELEASE_TAG="${BASE_TAG}-fork.${DATE_UTC}"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          ASSET_NAME="radar-desktop_${RELEASE_TAG}_darwin_universal.zip"
          CHECKSUM_FILE="checksums-desktop.txt"
          UPSTREAM_SHA="$(git rev-parse --short upstream/main)"

          {
            echo "base_tag=${BASE_TAG}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_version=${RELEASE_VERSION}"
            echo "asset_name=${ASSET_NAME}"
            echo "checksum_file=${CHECKSUM_FILE}"
            echo "upstream_sha=${UPSTREAM_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Create dummy kubeconfig for Wails binding generation
        run: |
          mkdir -p ~/.kube
          cat > ~/.kube/config << 'KUBECONFIG'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://localhost:6443
            name: dummy
          contexts:
          - context:
              cluster: dummy
              user: dummy
            name: dummy
          current-context: dummy
          users:
          - name: dummy
            user:
              token: dummy
          KUBECONFIG

      - name: Build macOS .app (universal)
        run: |
          make desktop-package-darwin \
            VERSION="${{ steps.meta.outputs.release_version }}" \
            LDFLAGS="-X main.version=${{ steps.meta.outputs.release_version }} -X github.com/skyhook-io/radar/internal/version.ReleaseRepo=${{ github.repository }}"

      - name: Archive app
        run: |
          cd build/bin
          mv radar-desktop.app Radar.app
          ditto -c -k --sequesterRsrc --keepParent Radar.app "../../${{ steps.meta.outputs.asset_name }}"
          cd ../..

      - name: Generate checksum
        run: |
          shasum -a 256 "${{ steps.meta.outputs.asset_name }}" > "${{ steps.meta.outputs.checksum_file }}"

      - name: Publish weekly desktop release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.release_tag }}"
          ASSET="${{ steps.meta.outputs.asset_name }}"
          CHECKSUM_FILE="${{ steps.meta.outputs.checksum_file }}"
          NOTES_FILE="$(mktemp)"

          cat > "${NOTES_FILE}" <<EOF
          Weekly fork desktop build based on upstream \`${{ steps.meta.outputs.base_tag }}\` at commit \`${{ steps.meta.outputs.upstream_sha }}\`.

          This release preserves the fork-only desktop userstyle support while pulling in the latest upstream code merged into \`main\`.
          EOF

          gh release delete "${TAG}" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true

          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "Radar Desktop ${TAG}" \
            --notes-file "${NOTES_FILE}" \
            --latest \
            "${ASSET}" \
            "${CHECKSUM_FILE}"

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Weekly Custom Desktop Release"
            echo ""
            if ls "${{ steps.meta.outputs.asset_name }}" 1>/dev/null 2>&1; then
              echo "- Release tag: \`${{ steps.meta.outputs.release_tag }}\`"
              echo "- Upstream base: \`${{ steps.meta.outputs.base_tag }}\`"
              echo "- Upstream commit: \`${{ steps.meta.outputs.upstream_sha }}\`"
              echo "- Asset: \`${{ steps.meta.outputs.asset_name }}\`"
              echo "- Update source: \`${{ github.repository }}\`"
            else
              echo "Build failed before artifact generation."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
