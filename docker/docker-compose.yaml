services:
  radar:
    image: ${RADAR_IMAGE:-ghcr.io/odhomane/radar:latest}
    container_name: ${RADAR_CONTAINER_NAME:-radar}
    # Host kubeconfigs are commonly 0600, so the container must read them as root.
    user: "0:0"
    restart: unless-stopped
    command:
      - --no-browser
      - --port
      - "${RADAR_PORT:-9009}"
    ports:
      - "${RADAR_PORT:-9009}:${RADAR_PORT:-9009}"
    environment:
      # Required by Helm operations in read-only style environments
      HELM_CACHE_HOME: /tmp/helm/cache
      HELM_CONFIG_HOME: /tmp/helm/config
      HELM_DATA_HOME: /tmp/helm/data
      # Ensure client-go + exec auth plugin use mounted host config paths
      KUBECONFIG: /home/nonroot/.kube/config
      AZURE_CONFIG_DIR: /home/nonroot/.azure
      CLOUDSDK_CONFIG: /home/nonroot/.config/gcloud
    volumes:
      # Mount your kubeconfig so Radar can connect to your cluster
      - ${KUBECONFIG_PATH:-${HOME}/.kube/config}:/home/nonroot/.kube/config:ro
      # Mount AWS CLI config for EKS auth
      - ${AWS_CONFIG_PATH:-${HOME}/.aws}:/root/.aws
      # Mount Azure CLI config for AKS kubelogin/azurecli auth
      - ${AZURE_CONFIG_PATH:-${HOME}/.azure}:/home/nonroot/.azure
      # Mount gcloud config for GKE exec auth plugin credentials (RW for token refresh)
      - ${GCLOUD_CONFIG_PATH:-${HOME}/.config/gcloud}:/home/nonroot/.config/gcloud
      # Persistent writable state for settings/auth DB when read_only is enabled
      - radar-data:/root/.radar
    read_only: true
    tmpfs:
      - /tmp

volumes:
  radar-data:
